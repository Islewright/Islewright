syntax = "proto3";

package islewright.protocol;

message Packet {
  uint32 protocol_version = 1;
  uint64 request_id = 2;

  oneof payload {
    CreateWorldRequest create_world_request = 10;
    CreateWorldResponse create_world_response = 11;
    ErrorResponse error_response = 12;
    ChunkRequest chunk_request = 20;
    ChunkResponse chunk_response = 21;
  }
}

message CreateWorldRequest {
  optional uint64 seed = 1;
}

message CreateWorldResponse {
  uint64 seed = 1;
}

message ChunkRequest {
  sint32 chunk_x = 1;
  sint32 chunk_y = 2;
}

message ChunkResponse {
  sint32 chunk_x = 1;
  sint32 chunk_y = 2;
  bytes tile_ids = 3;
  bytes biomes = 4;
}

message ErrorResponse {
  enum Code {
    UNSPECIFIED = 0;
    INVALID_REQUEST = 1;
    UNSUPPORTED_VERSION = 2;
    INTERNAL_ERROR = 3;
  }

  Code code = 1;
  string message = 2;
}
